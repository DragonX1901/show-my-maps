plugins {
    id 'java'
}

group = 'org.dx'
version = '1.2.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    // oldest supported API, so one jar covers the range
    compileOnly 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'

    // MockBukkit needs a newer API than the jar targets
    testImplementation 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.108.0'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 1.20.1-1.20.4 servers run Java 17; tests still run on 21 for MockBukkit
tasks.named('compileJava') {
    options.release = 17
}

tasks.named('jar') {
    archiveBaseName = 'ShowMyMaps-Paper'
    from(rootProject.file('../LICENSE')) {
        rename { "${it}_ShowMyMaps" }
    }
}

tasks.named('processResources') {
    inputs.property 'version', project.version

    filesMatching('plugin.yml') {
        expand version: project.version
    }
}
