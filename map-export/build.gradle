plugins {
    id 'java'
}

group = 'org.dx'
version = '1.2.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        // Nothing here touches Minecraft, so it runs on whatever a server host has.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('jar') {
    archiveBaseName = 'ShowMyMaps-Export'

    manifest {
        attributes 'Main-Class': 'org.dx.showmymaps.export.Main'
    }

    from(rootProject.file('../LICENSE')) {
        rename { "${it}_ShowMyMaps" }
    }
}
