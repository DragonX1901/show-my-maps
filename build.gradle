// Loom is loaded through buildscript rather than the plugins block, because each
// version needs its own Loom: 26.x only works on the alphas that understand an
// unobfuscated Minecraft.
buildscript {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        gradlePluginPortal()
    }

    dependencies {
        classpath "net.fabricmc:fabric-loom:${project.loom_version}"
    }
}

// 26.x ships without obfuscation. Loom has a separate plugin id for that case: it
// skips mappings and remapping entirely.
ext.unobfuscated = project.findProperty("unobfuscated") == "true"

apply plugin: unobfuscated ? "net.fabricmc.fabric-loom" : "fabric-loom"
apply plugin: "maven-publish"

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "show_my_maps" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// The client gametest API only exists from 1.21.9 on, so the tests build and run
// against the newest version and cover the shared code for all of them.
ext.clientGameTests = project.findProperty("client_gametests") == "true"

fabricApi {
    configureDataGeneration {
        client = true
    }

    if (clientGameTests) {
        configureTests {
            createSourceSet = true
            modId = "show_my_maps_test"
            enableGameTests = false
            enableClientGameTests = true
            eula = true
        }
    }
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }

    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }

    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

// Without obfuscation there is nothing to remap, so Loom drops the mod* configurations.
def modApi = unobfuscated ? "implementation" : "modImplementation"
def modCompileOnlyConf = unobfuscated ? "compileOnly" : "modCompileOnly"
def modRuntimeConf = unobfuscated ? "runtimeOnly" : "modLocalRuntime"

dependencies {
    // To change the versions see versions/<game version>/gradle.properties
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    if (!unobfuscated) {
        mappings loom.officialMojangMappings()
    }

    add(modApi, "net.fabricmc:fabric-loader:${project.loader_version}")
    add(modApi, "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    // Optional at runtime: the config screen is registered through Mod Menu's entrypoint,
    // which Fabric only loads when Mod Menu is installed.
    add(modCompileOnlyConf, "com.terraformersmc:modmenu:${project.modmenu_version}")
    add(modRuntimeConf, "com.terraformersmc:modmenu:${project.modmenu_version}")

    // Dev-only, to check the two mods coexist. Never a runtime requirement.
    if (project.shulkerboxtooltip_version) {
        add(modRuntimeConf, "maven.modrinth:shulkerboxtooltip:${project.shulkerboxtooltip_version}")
    }
}

// Keep dev runs silent: the test client opens on a real audio device.
def writeRunOptions = { File runDir, boolean lowSpec ->
    runDir.mkdirs()
    def options = new File(runDir, "options.txt")
    def volumes = ["master", "music", "ambient", "weather", "block", "hostile", "neutral", "player", "record", "voice"]
    def lines = volumes.collect { "soundCategory_${it}:0.0" }

    if (lowSpec) {
        // The test client has to load a world within a fixed tick budget, and CI
        // runners draw with llvmpipe on few cores. Cut everything that costs frames.
        lines += [
            'graphicsPreset:"fast"',
            "renderDistance:3",
            "simulationDistance:5",
            "biomeBlendRadius:0",
            "mipmapLevels:0",
            "ao:false",
            "entityShadows:false",
            "enableVsync:false",
            "particles:2",
            'renderClouds:"false"',
            "maxFps:60"
        ]
    }

    options.text = lines.join("\n") + "\n"
}

// Minecraft sizes its chunk worker pool from the core count, and CI runners are
// small enough that spawn chunks never finish inside the harness tick budget.
if (clientGameTests) {
    tasks.named("runClientGameTest") {
        jvmArgs "-Dmax.bg.threads=4"
    }
}

tasks.matching { it.name in ["runClient", "runClientGameTest", "runServer"] }.configureEach {
    doFirst {
        boolean gameTest = it.name == "runClientGameTest"
        writeRunOptions(file(gameTest ? "build/run/clientGameTest" : "run"), gameTest)
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "mod_minecraft_range", project.mod_minecraft_range
    inputs.property "fabric_api_range", project.fabric_api_range
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "mod_minecraft_range": project.mod_minecraft_range,
                "fabric_api_range": project.fabric_api_range
    }
}

def targetJavaVersion = project.java_version as int
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    // The licence sits at the repo root, one level up from each version project.
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
