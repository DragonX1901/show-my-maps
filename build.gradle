// buildscript, not plugins {}: each version needs its own Loom, and 26.x needs the alphas
buildscript {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        gradlePluginPortal()
    }

    dependencies {
        classpath "net.fabricmc:fabric-loom:${project.loom_version}"
    }
}

// 26.x is unobfuscated; this Loom plugin id skips mappings and remapping
ext.unobfuscated = project.findProperty("unobfuscated") == "true"

apply plugin: unobfuscated ? "net.fabricmc.fabric-loom" : "fabric-loom"
apply plugin: "maven-publish"

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    // ./gradlew :1.21.11:runClient -Ptest_server=127.0.0.1:25565 joins an external server on start
    if (project.hasProperty("test_server")) {
        runs {
            client {
                programArgs "--quickPlayMultiplayer", project.property("test_server").toString()
            }
        }
    }

    mods {
        "show_my_maps" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// client gametests need 1.21.9+, so they run on the newest version and cover the shared code
ext.clientGameTests = project.findProperty("client_gametests") == "true"

fabricApi {
    configureDataGeneration {
        client = true
    }

    if (clientGameTests) {
        configureTests {
            createSourceSet = true
            modId = "show_my_maps_test"
            enableGameTests = false
            enableClientGameTests = true
            eula = true
        }
    }
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }

    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }

}

def modApi = unobfuscated ? "implementation" : "modImplementation"
def modCompileOnlyConf = unobfuscated ? "compileOnly" : "modCompileOnly"
def modRuntimeConf = unobfuscated ? "runtimeOnly" : "modLocalRuntime"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    if (!unobfuscated) {
        mappings loom.officialMojangMappings()
    }

    add(modApi, "net.fabricmc:fabric-loader:${project.loader_version}")
    add(modApi, "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    // optional: Fabric only loads the modmenu entrypoint when Mod Menu is present.
    // not transitive: older releases pull Placeholder API from a repo we do not use
    add(modCompileOnlyConf, "com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    add(modRuntimeConf, "com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }

    // dev only, to check the two mods coexist
    if (project.shulkerboxtooltip_version) {
        add(modRuntimeConf, "maven.modrinth:shulkerboxtooltip:${project.shulkerboxtooltip_version}")
    }
}

// dev runs stay silent
def writeRunOptions = { File runDir, boolean lowSpec ->
    runDir.mkdirs()
    def options = new File(runDir, "options.txt")
    def volumes = ["master", "music", "ambient", "weather", "block", "hostile", "neutral", "player", "record", "voice"]
    def lines = volumes.collect { "soundCategory_${it}:0.0" }

    // -Pshot_size=1280x720 for gallery screenshots
    def shotSize = project.findProperty("shot_size")

    if (shotSize) {
        def (width, height) = shotSize.tokenize("x")
        lines += ["overrideWidth:${width}", "overrideHeight:${height}"]
    }

    if (lowSpec) {
        // CI draws with llvmpipe on few cores and the harness gives the world a fixed tick budget
        lines += [
            // the menu blur is a post pass per frame, too slow on a software renderer
            "menuBackgroundBlurriness:0",
            'graphicsPreset:"fast"',
            "renderDistance:3",
            "simulationDistance:5",
            "biomeBlendRadius:0",
            "mipmapLevels:0",
            "ao:false",
            "entityShadows:false",
            "enableVsync:false",
            "particles:2",
            'renderClouds:"false"',
            "maxFps:60"
        ]
    }

    options.text = lines.join("\n") + "\n"
}

// the chunk worker pool scales with cores; small CI runners miss the harness budget
if (clientGameTests) {
    tasks.named("runClientGameTest") {
        jvmArgs "-Dmax.bg.threads=4"
    }
}



tasks.matching { it.name in ["runClient", "runClientGameTest", "runServer"] }.configureEach {
    doFirst {
        boolean gameTest = it.name == "runClientGameTest"
        writeRunOptions(file(gameTest ? "build/run/clientGameTest" : "run"), gameTest)
    }
}

// below 1.20.5 a map id is a bare int, so imports swap to the mod's own MapId
stonecutter {
    replacements.string(current.parsed.matches('<1.20.5')) {
        replace 'import net.minecraft.world.level.saveddata.maps.MapId;', 'import org.dx.show_my_maps.compat.MapId;'
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "mod_minecraft_range", project.mod_minecraft_range
    inputs.property "fabric_api_range", project.fabric_api_range
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "mod_minecraft_range": project.mod_minecraft_range,
                "fabric_api_range": project.fabric_api_range
    }
}

// Mixin rejects a compatibility level above the running JVM, and 1.20.1-1.20.4 run on 17
tasks.withType(ProcessResources).configureEach {
    inputs.property "java_version", project.java_version

    filesMatching("*.mixins.json") {
        expand "java_version": project.java_version
    }
}

def targetJavaVersion = project.java_version as int
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
