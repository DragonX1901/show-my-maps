name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/*.jar

  gametest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The tests drive a real client, which needs a display and a GL stack.
      - name: Install display and GL packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils

      - name: Show runner capabilities
        run: |
          nproc
          free -m
          xvfb-run -a glxinfo -B || true

      - name: Run client gametests
        timeout-minutes: 30
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" ./gradlew runClientGameTest --stacktrace &
          gradle_pid=$!

          # World loading has stalled here before. If it happens again, print what
          # the client threads are doing instead of only the timeout.
          (
            sleep 150
            for pid in $(pgrep -f devlaunchinjector); do
              echo "=== thread dump $pid ==="
              jcmd "$pid" Thread.print || true
            done
          ) &

          wait $gradle_pid

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: build/run/clientGameTest/screenshots/*.png
          if-no-files-found: ignore
