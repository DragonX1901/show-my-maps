name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/*.jar

  gametest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The tests drive a real client, which needs a display and a GL stack.
      - name: Install display and GL packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils

      - name: Run client gametests
        timeout-minutes: 30
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: xvfb-run -a -s "-screen 0 1280x800x24" ./gradlew runClientGameTest --stacktrace

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: build/run/clientGameTest/screenshots/*.png
          if-no-files-found: ignore
