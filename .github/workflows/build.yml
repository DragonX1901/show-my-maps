name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ["1.21.1", "1.21.11", "26.2"]
    steps:
      - uses: actions/checkout@v7

      # 26.x needs a Java 25 Gradle daemon, because its Loom alpha is built for it.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build ${{ matrix.version }}
        run: ./gradlew ":${{ matrix.version }}:build" --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.version }}
          path: versions/${{ matrix.version }}/build/libs/*.jar

  gametest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # The tests drive a real client, which needs a display and a GL stack.
      - name: Install display and GL packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils

      - name: Show runner capabilities
        run: |
          nproc
          free -m
          xvfb-run -a glxinfo -B || true

      # Only 1.21.9+ has the client gametest API, and the tests exercise code shared
      # by every version.
      - name: Run client gametests
        timeout-minutes: 30
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          run_tests() {
            xvfb-run -a -s "-screen 0 1280x800x24" ./gradlew ":1.21.11:runClientGameTest" --stacktrace &
            gradle_pid=$!

            # Spawn chunk generation stalls on some runners and the harness gives up
            # waiting for the world. Print what the threads are doing while it is stuck,
            # so a repeat is diagnosable from the log alone.
            (
              sleep 45
              for pid in $(pgrep -f devlaunchinjector); do
                echo "=== thread dump $pid ==="
                jcmd "$pid" Thread.print || true
              done
            ) &
            dump_pid=$!

            wait $gradle_pid
            status=$?
            kill $dump_pid 2>/dev/null || true
            return $status
          }

          run_tests || {
            echo "::warning::client gametests failed once, retrying"
            run_tests
          }

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: versions/1.21.11/build/run/clientGameTest/screenshots/*.png
          if-no-files-found: ignore
