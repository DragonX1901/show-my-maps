name: Release

# Tag a commit to publish, e.g. git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version number, without the leading v
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # One Modrinth version per game version, uploaded one at a time.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - version: "1.21.1"
            game-versions: "1.21\n1.21.1"
          - version: "1.21.11"
            game-versions: "1.21.9\n1.21.10\n1.21.11"
          - version: "26.2"
            game-versions: "26.2"
    steps:
      - uses: actions/checkout@v7

      # 26.x needs a Java 25 Gradle daemon, because its Loom alpha is built for it.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build ${{ matrix.version }}
        run: ./gradlew ":${{ matrix.version }}:build" --stacktrace

      - name: Read version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "number=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth and GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ANHah0JE
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: versions/${{ matrix.version }}/build/libs/!(*-sources).jar
          name: ${{ steps.version.outputs.number }} for ${{ matrix.version }}
          version: ${{ steps.version.outputs.number }}+${{ matrix.version }}
          version-type: release
          loaders: fabric
          game-versions: ${{ matrix.game-versions }}
          dependencies: |
            fabric-api(required)
            modmenu(optional)
