name: Release

# Manual only: tagging no longer auto-publishes. Run from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number, without the leading v
        required: true
      channel:
        description: Release channel
        type: choice
        default: release
        options:
          - release
          - beta
          - alpha

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      # One Modrinth version per game version, uploaded one at a time.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - version: "1.21.1"
            game-versions: "1.21\n1.21.1"
          - version: "1.21.11"
            game-versions: "1.21.9\n1.21.10\n1.21.11"
          - version: "26.1.2"
            game-versions: "26.1\n26.1.1\n26.1.2"
          - version: "26.2"
            game-versions: "26.2"
    steps:
      - uses: actions/checkout@v7

      # 26.x needs a Java 25 Gradle daemon, because its Loom alpha is built for it.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build ${{ matrix.version }}
        run: ./gradlew ":${{ matrix.version }}:build" --stacktrace

      - name: Read version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "number=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth and GitHub
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ANHah0JE
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: versions/${{ matrix.version }}/build/libs/!(*-sources).jar
          name: ${{ steps.version.outputs.number }} for ${{ matrix.version }}
          version: ${{ steps.version.outputs.number }}+${{ matrix.version }}
          version-type: ${{ inputs.channel || 'release' }}
          loaders: fabric
          game-versions: ${{ matrix.game-versions }}
          dependencies: |
            fabric-api(required)
            modmenu(optional)

  # The server half is one jar for the whole supported range, and it used to be
  # uploaded by hand, which meant it silently fell a release behind.
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the Paper plugin
        run: ./gradlew -p paper-plugin build --stacktrace

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ANHah0JE
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: paper-plugin/build/libs/!(*-sources).jar
          name: ${{ inputs.version }} for Paper (server plugin)
          version: ${{ inputs.version }}+paper
          version-type: ${{ inputs.channel || 'release' }}
          loaders: |
            paper
            purpur
            folia
            spigot
            bukkit
          # Built against the oldest API in the range, so one jar covers all of it.
          game-versions: |
            1.21.1
            1.21.2
            1.21.3
            1.21.4
            1.21.5
            1.21.6
            1.21.7
            1.21.8
            1.21.9
            1.21.10
            1.21.11
            26.1
            26.1.1
            26.1.2
            26.2
